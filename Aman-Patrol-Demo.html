          '<div class="progress"><div style="width:' + Math.min(100, (s.count / s.min_required) * 100) + '%"></div></div>' +
          '<div class="volunteers">' + names + "</div>" + mineInfo +
          '<div class="row mt-12">' + action + "</div></div>";
      }).join("") || '<div class="empty"><div class="big">🗓️</div>No patrol slots scheduled yet.</div>');

    $all("[data-claim]").forEach(function (b) {
      b.onclick = function () {
        var s = S().slotById(b.getAttribute("data-claim"));
        modal(
          "<h3>Confirm your shift</h3>" +
          '<p class="m-sub">You\'ll patrol ' + esc(s.activity_window) + " — " + esc(S().fmtDate(s.date)) + ", " + esc(s.time_window) + " · " + esc(s.zone) + "</p>" +
          '<div class="detail-list" style="font-size:0.84rem">' +
          '<div><span class="dl-k">Meeting point</span><span class="dl-v">' + (s.zone.indexOf("A") !== -1 ? "Greenside Masjid" : "Emmarentia Masjid") + " (confirm with coordinator)</span></div>" +
          "<div><span class=\"dl-k\">Pair patrol</span><span class=\"dl-v\">Minimum " + s.min_required + " volunteers — " + (s.understaffed ? "needs " + (s.min_required - s.count) + " more" : "already full") + "</span></div>" +
          '<div><span class="dl-k">Bring</span><span class="dl-v">Charged phone · hi-vis vest · radio (Zello)</span></div>' +
          "</div>" +
          '<div class="m-actions"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-teal" id="claim-yes">Sign me up</button></div>',
          function (root) {
            root.querySelector("#claim-yes").onclick = function () {
              var res = S().claimSlot(s.id, user.id);
              closeModal();
              toast(res.ok ? "You're signed up. A reminder will arrive 15 minutes before your shift." : res.error, res.ok ? "ok" : "error");
              refreshBell();
              renderRoster();
            };
          }
        );
      };
    });
    $all("[data-unclaim]").forEach(function (b) {
      b.onclick = function () {
        var res = S().unclaim(b.getAttribute("data-unclaim"), user.id);
        toast(res.ok ? "You've been removed from that shift." : res.error, res.ok ? "ok" : "error");
        renderRoster();
      };
    });
    $all("[data-start]").forEach(function (b) { b.onclick = function () { startShiftFlow(b.getAttribute("data-start"), renderRoster); }; });
    $all("[data-end]").forEach(function (b) { b.onclick = function () { endShiftFlow(b.getAttribute("data-end"), renderRoster); }; });
  }

  function startShiftFlow(slotId, rerender) {
    var user = S().sessionUser();
    var slot = S().slotById(slotId);
    toast("Capturing your GPS position…");
    captureGPS(function (gps) {
      if (!gps) gps = zoneCenter(slot.zone);
      var res = S().startShift(slotId, user.id, gps);
      if (!res.ok) { toast(res.error, "error"); return; }
      toast("Shift started at " + S().fmtTime(res.start_shift_time) + " · GPS " + gps.lat.toFixed(4) + ", " + gps.lng.toFixed(4) + " (" + gps.source + ")", "ok");
      if (rerender) rerender();
    });
  }
  function endShiftFlow(slotId, rerender) {
    var user = S().sessionUser();
    var slot = S().slotById(slotId);
    captureGPS(function (gps) {
      if (!gps) gps = zoneCenter(slot.zone);
      var res = S().endShift(slotId, user.id, gps);
      if (!res.ok) { toast(res.error, "error"); return; }
      toast("Shift completed at " + S().fmtTime(res.end_shift_time) + " — thank you for your service. Shift log updated.", "ok");
      if (rerender) rerender();
    });
  }

  /* ============================================================
     SCREEN: AREA MAP
     ============================================================ */
  function renderMap() {
    var user = S().sessionUser();
    setShell(true);
    setActiveNav("map");
    screenEl.className = "screen map-screen";
    screenEl.innerHTML =
      '<div class="map-wrap"><div id="map"></div>' +
      '<button class="map-fab hidden" id="add-pin-btn" title="Add a coordinator pin">📍 Add pin</button>' +
      '<div class="map-note" id="map-note"></div></div>';
    window.AmanMap.setAddPinHandler(addPinModal);
    window.AmanMap.mount();
    if (user.role === "coordinator") {
      var pb = $("#add-pin-btn");
      pb.classList.remove("hidden");
      pb.onclick = function () { window.AmanMap.startAddPin(); };
    }
  }

  function addPinModal(lat, lng) {
    var user = S().sessionUser();
    var TYPES = [
      ["dark_spot", "Dark spot (unlit area)"],
      ["risk_corner", "Known risk corner"],
      ["madrassah_corridor", "Madrassah walking corridor"],
      ["recent_incident", "Recent incident location"],
      ["other", "Other"]
    ];
    modal(
      "<h3>Add coordinator pin</h3>" +
      '<p class="m-sub">Placing at ' + lat.toFixed(5) + ", " + lng.toFixed(5) + "</p>" +
      '<div class="field"><label>Label</label><input id="np-label" placeholder="e.g. Dark spot — culvert on Tana Road"></div>' +
      '<div class="field"><label>Type</label><select id="np-type">' + TYPES.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + "</option>"; }).join("") + "</select></div>" +
      '<div class="m-actions"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-teal" id="np-save">Add pin</button></div>',
      function (root) {
        root.querySelector("#np-save").onclick = function () {
          var label = root.querySelector("#np-label").value.trim();
          if (!label) { toast("Please give the pin a label.", "error"); return; }
          S().addPin({ label: label, type: root.querySelector("#np-type").value, lat: lat, lng: lng, created_by: user.id });
          closeModal();
          window.AmanMap.refreshPins();
          toast("Pin added to the area map.", "ok");
        };
      }
    );
  }

  function deletePin(id) {
    if (confirm("Remove this pin from the map?")) {
      S().removePin(id);
      window.AmanMap.refreshPins();
      toast("Pin removed.");
    }
  }

  /* ============================================================
     SCREEN: NOTIFICATIONS
     ============================================================ */
  function renderNotifications() {
    var user = S().sessionUser();
    setShell(true);
    setActiveNav("");
    screenEl.className = "screen";
    var list = S().notificationsFor(user);
    var KIND = {
      ok: ["var(--ok-soft)", "✅"], info: ["var(--info-soft)", "ℹ️"], warn: ["var(--warn-soft)", "⚠️"],
      danger: ["var(--danger-soft)", "🚨"]
    };
    var notifPermission = (window.Notification && Notification.permission) || "unsupported";

    screenEl.innerHTML =
      '<h1 class="page-title">Notifications</h1>' +
      '<div class="row" style="margin-bottom:12px">' +
      (user.role === "coordinator" ? '<button class="btn btn-ghost btn-sm grow" id="announce-btn">📢 Send announcement</button>' : "") +
      '<button class="btn btn-ghost btn-sm grow" id="mark-read">✓ Mark all read</button></div>' +
      (notifPermission === "default" ? '<button class="btn btn-primary block" id="enable-push" style="margin-bottom:12px">🔔 Enable browser notifications</button>' : "") +
      '<div class="card tight" style="padding:0">' +
      (list.map(function (n) {
        var k = KIND[n.kind] || KIND.info;
        var unread = n.read_by.indexOf(user.id) === -1;
        return '<div class="notif' + (unread ? " unread" : "") + '">' +
          '<div class="n-icon" style="background:' + k[0] + '">' + k[1] + "</div>" +
          '<div class="grow"><div class="n-title">' + esc(n.title) + "</div>" +
          (n.body ? '<div class="n-body">' + esc(n.body) + "</div>" : "") +
          '<div class="n-time">' + esc(S().timeAgo(n.created_at)) + "</div></div></div>";
      }).join("") || '<div class="empty"><div class="big">🔕</div>No notifications yet.</div>') +
      "</div>";

    $("#mark-read").onclick = function () { S().markAllRead(user); refreshBell(); renderNotifications(); };
    var eb = $("#enable-push");
    if (eb) eb.onclick = function () {
      Notification.requestPermission().then(function () { renderNotifications(); });
    };
    var ab = $("#announce-btn");
    if (ab) ab.onclick = function () {
      modal(
        "<h3>📢 Send announcement</h3>" +
        '<p class="m-sub">Goes to every approved volunteer\'s notification feed.</p>' +
        '<div class="field"><label>Title</label><input id="an-title" placeholder="e.g. Jumu\'ah security briefing"></div>' +
        '<div class="field"><label>Message</label><textarea id="an-body" placeholder="Assalamu alaykum — details…"></textarea></div>' +
        '<div class="m-actions"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-teal" id="an-send">Send</button></div>',
        function (root) {
          root.querySelector("#an-send").onclick = function () {
            var t = root.querySelector("#an-title").value.trim();
            var b = root.querySelector("#an-body").value.trim();
            if (!t) { toast("Please add a title.", "error"); return; }
            S().pushNotif({ audience: { type: "all" }, kind: "info", title: "Coordinator announcement: " + t, body: b });
            closeModal();
            toast("Announcement sent to all volunteers.", "ok");
            refreshBell();
            renderNotifications();
          };
        }
      );
    };
    refreshBell();
    setTimeout(function () { S().markAllRead(user); refreshBell(); }, 2500);
  }

  /* ============================================================
     SCREEN: MORE (profile · my shifts · my reports · about)
     ============================================================ */
  function renderMore() {
    var user = S().sessionUser();
    setShell(true);
    setActiveNav("more");
    screenEl.className = "screen";
    var claims = S().myClaims(user.id).sort(function (a, b) { return S().slotStartISO(b.slot || a.slot) - S().slotStartISO(a.slot || b.slot); });
    var myIncidents = S().incidents().filter(function (i) { return i.user_id === user.id; });

    screenEl.innerHTML =
      '<div class="card"><div class="vrow">' +
      '<div class="avatar' + (user.role === "coordinator" ? " teal" : "") + '">' + esc(user.first_name[0] + user.surname[0]) + "</div>" +
      '<div class="grow"><div class="name">' + esc(user.first_name + " " + user.surname) + "</div>" +
      '<div class="sub">' + esc(user.email) + "</div></div>" +
      '<span class="chip ' + (user.role === "coordinator" ? "teal" : "ok") + '">' + (user.role === "coordinator" ? "Coordinator" : "Volunteer") + "</span></div>" +
      '<div class="divider"></div>' +
      '<dl class="kv"><dt>WhatsApp</dt><dd>' + esc(user.whatsapp) + "</dd>" +
      "<dt>Address</dt><dd>" + esc(user.street + ", " + user.suburb) + "</dd></dl></div>" +

      (user.role === "coordinator" ? '<a class="action full" href="#/admin/approvals" style="margin-bottom:12px"><div class="a-icon navy">🛡️</div><div class="grow"><div class="a-label">Coordinator dashboard</div></div></a>' : "") +

      '<h3 style="font-size:0.95rem;margin:10px 0 8px">My shifts (' + claims.length + ")</h3>" +
      '<div class="card tight">' +
      (claims.map(function (c) {
        if (!c.slot) return "";
        return '<div class="detail-list"><div><span class="dl-k">' + esc(S().fmtDate(c.slot.date)) + " · " + esc(c.slot.time_window) + "</span>" +
          '<span class="dl-v">' + esc(c.slot.zone.replace("Zone ", "")) + " · " + esc(c.slot.activity_window) +
          (c.status === "completed" && c.start_shift_time ? " · " + esc(S().fmtTime(c.start_shift_time) + "–" + S().fmtTime(c.end_shift_time)) : "") +
          ' <span class="chip ' + (c.status === "completed" ? "ok" : c.status === "started" ? "info" : "grey") + '" style="margin-left:4px">' + c.status + "</span></span></div></div>";
      }).join("") || '<div class="muted" style="font-size:0.8rem">No shifts yet — claim one from the roster.</div>') +
      "</div>" +

      '<h3 style="font-size:0.95rem;margin:14px 0 8px">My reports (' + myIncidents.length + ")</h3>" +
      '<div class="card tight">' +
      (myIncidents.map(function (i) {
        var shortCat = i.category.indexOf(" (") !== -1 ? i.category.slice(i.category.indexOf(" (") + 2, -1) : i.category;
        return '<div class="detail-list"><div style="cursor:pointer" data-inc="' + i.id + '"><span class="dl-k">' + esc(S().fmtDate(i.created_at.slice(0, 10))) + " · " + esc(shortCat) + "</span>" +
          '<span class="dl-v">' + esc(i.status) + "</span></div></div>";
      }).join("") || '<div class="muted" style="font-size:0.8rem">No reports yet.</div>') +
      "</div>" +

      '<div class="card">' +
      '<button class="btn btn-ghost block" id="coc-btn" style="margin-bottom:10px">📜 Code of Conduct &amp; values</button>' +
      '<button class="btn btn-ghost block" id="radio-btn2" style="margin-bottom:10px">📻 Patrol radio (Zello)</button>' +
      '<button class="btn btn-ghost danger block" id="reset-btn" style="margin-bottom:10px">♻️ Reset demo data</button>' +
      '<button class="btn btn-primary block" id="logout-btn">Log out</button></div>' +
      '<p class="center" style="font-size:0.66rem;color:var(--muted);line-height:1.6">Aman Patrol · observe &amp; report only · map data © OpenStreetMap contributors · weather by Open-Meteo<br>Demo build — data stays on this device until Supabase is connected.</p>';

    $all("[data-inc]").forEach(function (r) { r.onclick = function () { window.AmanAdmin.incidentModal(r.getAttribute("data-inc"), null); }; });
    $("#coc-btn").onclick = codeOfConductModal;
    $("#radio-btn2").onclick = radioModal;
    $("#logout-btn").onclick = doLogout;
    $("#reset-btn").onclick = function () {
      modal(
        "<h3>Reset demo data?</h3>" +
        '<p class="m-sub">This restores the original sample volunteers, slots, incidents and pins, and logs you out.</p>' +
        '<div class="m-actions"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" id="reset-yes">Reset</button></div>',
        function (root) {
          root.querySelector("#reset-yes").onclick = function () {
            S().resetDemo();
            closeModal();
            location.hash = "#/register";
            route();
            toast("Demo data restored.", "ok");
          };
        }
      );
    };
  }

  /* ============================================================
     ROUTER
     ============================================================ */
  function route() {
    var user = S().sessionUser();
    var hash = location.hash || "";
    var parts = hash.replace(/^#\/?/, "").split("/");
    var page = parts[0] || "";
    window.AmanMap.destroy();

    if (!user) {
      if (page === "login") renderLogin();
      else renderRegister();
      return;
    }
    if (user.status === "pending") { renderPending(user); return; }
    if (user.status === "declined") { renderDeclined(user); return; }

    switch (page) {
      case "login": case "register": location.hash = "#/dashboard"; return;
      case "roster": renderRoster(); break;
      case "incident": window.AmanIncident.render(screenEl); setActiveNav(""); break;
      case "map": renderMap(); break;
      case "notifications": renderNotifications(); break;
      case "more": renderMore(); break;
      case "admin": window.AmanAdmin.render(screenEl, parts[1] || "approvals"); setActiveNav(""); break;
      default: renderDashboard();
    }
    refreshBell();
  }

  /* ============================================================
     15-MINUTE SHIFT REMINDERS
     ============================================================ */
  var remindedClaims = {};
  function checkReminders() {
    var user = S().sessionUser();
    if (!user || user.status !== "approved") return;
    S().myClaims(user.id).forEach(function (c) {
      if (!c.slot || c.status !== "claimed" || remindedClaims[c.id]) return;
      var start = S().slotStartISO(c.slot);
      var mins = (start - Date.now()) / 60000;
      if (mins > 0 && mins <= 15) {
        remindedClaims[c.id] = true;
        S().pushNotif({
          audience: { type: "user", id: user.id }, kind: "warn",
          title: "Your shift starts in 15 minutes",
          body: c.slot.activity_window + " — " + S().fmtDate(c.slot.date) + ", " + c.slot.time_window + " · " + c.slot.zone + ". Meet your partner, radio check, then START SHIFT in the app."
        });
        browserNotify("Your shift starts in 15 minutes", c.slot.activity_window + " · " + c.slot.zone);
        refreshBell();
      }
    });
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function boot() {
    screenEl = $("#screen");
    $("#logo-slot").innerHTML = LOGO.replace(/\{s\}/g, "30");
    $("#bell-icon").innerHTML = ICONS.bell;
    $("#fab-incident").innerHTML = ICONS.plus;
    $("#nav-dashboard").innerHTML = ICONS.home + "<span>Home</span>";
    $("#nav-roster").innerHTML = ICONS.roster + "<span>Roster</span>";
    $("#nav-map").innerHTML = ICONS.map + "<span>Map</span>";
    $("#nav-more").innerHTML = ICONS.more + "<span>More</span>";
    $("#fab-incident").addEventListener("click", function () { location.hash = "#/incident"; });

    window.addEventListener("hashchange", route);
    route();
    setInterval(function () { checkReminders(); refreshBell(); }, 60000);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  /* expose a few things needed by map popups & other modules */
  window.AmanApp = { viewIncident: function (id) { window.AmanAdmin.incidentModal(id, null); }, deletePin: deletePin };
  window.AmanUI = { esc: esc, toast: toast, modal: modal, closeModal: closeModal, refreshBell: refreshBell, captureGPS: captureGPS };
})();

</script>
</body>
</html>
