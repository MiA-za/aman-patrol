        S.approveUser(b.getAttribute("data-approve"));
        window.AmanUI.toast("Volunteer approved and notified.", "ok");
        window.AmanUI.refreshBell();
        render(el);
      };
    });
    el.querySelectorAll("[data-decline]").forEach(function (b) {
      b.onclick = function () {
        if (confirm("Decline this application?")) {
          S.declineUser(b.getAttribute("data-decline"));
          window.AmanUI.toast("Application declined.");
          render(el);
        }
      };
    });
  }

  /* ---------------- volunteers ---------------- */
  function renderVolunteers(el) {
    var S = window.AmanStore;
    var users = S.users().slice().sort(function (a, b) { return a.status === b.status ? a.first_name.localeCompare(b.first_name) : (a.status === "approved" ? -1 : 1); });
    var counts = { approved: 0, pending: 0, declined: 0 };
    users.forEach(function (u) { counts[u.status] = (counts[u.status] || 0) + 1; });
    el.innerHTML =
      '<div class="stat-grid">' +
      '<div class="stat"><div class="s-num">' + counts.approved + '</div><div class="s-label">Active</div></div>' +
      '<div class="stat"><div class="s-num">' + counts.pending + '</div><div class="s-label">Pending</div></div>' +
      '<div class="stat"><div class="s-num">' + counts.declined + '</div><div class="s-label">Declined</div></div></div>' +
      users.map(function (u) {
        var roleChip = u.role === "coordinator" ? ' <span class="chip teal">Coordinator</span>' : "";
        return userCard(u, '<div style="margin-top:8px">' + roleChip + "</div>");
      }).join("");
  }

  /* ---------------- roster management ---------------- */
  function renderRoster(el) {
    var S = window.AmanStore;
    var slots = S.slots();
    var me = S.sessionUser();
    var approved = S.users().filter(function (u) { return u.status === "approved" && u.role === "volunteer"; });
    el.innerHTML =
      '<button class="btn btn-teal block mb-0" id="add-slot-btn" style="margin-bottom:12px">+ Create patrol slot</button>' +
      slots.map(function (s) {
        var rows = s.claims.map(function (c) {
          return '<div class="row tight" style="padding:6px 0">' +
            '<div class="grow"><span style="font-weight:800;font-size:0.82rem">' + esc(c.user.first_name + " " + c.user.surname) + "</span> " +
            '<span class="chip ' + (c.status === "completed" ? "ok" : c.status === "started" ? "info" : "grey") + '" style="margin-left:6px">' + c.status + "</span></div>" +
            (c.status !== "started" ? '<button class="btn btn-ghost danger btn-sm" data-remove-claim="' + c.id + '">Remove</button>' : '<span style="font-size:0.7rem;color:var(--muted)">on shift</span>') +
            "</div>";
        }).join("") || '<div class="muted" style="font-size:0.78rem;padding:4px 0">No volunteers yet.</div>';
        var taken = s.claims.map(function (c) { return c.user_id; });
        var free = approved.filter(function (u) { return taken.indexOf(u.id) === -1; });
        var assign = free.length
          ? '<div class="row mt-8"><select data-assign="' + s.id + '" style="flex:1;min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:0.82rem">' +
            '<option value="">Assign volunteer…</option>' + free.map(function (u) { return '<option value="' + u.id + '">' + esc(u.first_name + " " + u.surname) + "</option>"; }).join("") + "</select></div>"
          : "";
        return '<div class="card slot' + (s.zone ? " " + (s.zone.indexOf("A") !== -1 ? "zone-a" : "zone-b") : "") + '">' +
          '<div class="row spread"><div>' +
          (s.zone
            ? '<span class="chip ' + (s.zone.indexOf("A") !== -1 ? "zone-a" : "zone-b") + '">' + esc(s.zone) + "</span>"
            : '<span class="chip grey">Volunteer-created</span>') +
          '<h3 style="margin:7px 0 2px">' + esc(s.activity_window) + "</h3>" +
          '<div class="muted" style="font-size:0.78rem">' + esc(S.fmtDate(s.date)) + " · " + esc(s.time_window) + " · min " + s.min_required + "</div></div>" +
          '<div class="center"><div class="count-pill">' + s.count + " / " + s.min_required + '</div><span class="chip ' + (s.understaffed ? "warn" : "ok") + '" style="margin-top:6px">' + (s.understaffed ? "Understaffed" : "Fully staffed") + "</span></div></div>" +
          '<div class="divider"></div>' + rows + assign +
          '<div class="row mt-8"><button class="link-btn" data-del-slot="' + s.id + '" style="color:var(--danger)">Delete slot</button></div>' +
          "</div>";
      }).join("");

    document.getElementById("add-slot-btn").onclick = addSlotModal;
    el.querySelectorAll("[data-remove-claim]").forEach(function (b) {
      b.onclick = function () { S.removeClaim(b.getAttribute("data-remove-claim")); renderRoster(el); };
    });
    el.querySelectorAll("[data-assign]").forEach(function (sel) {
      sel.onchange = function () {
        var uid = sel.value;
        if (!uid) return;
        S.assignVolunteer(sel.getAttribute("data-assign"), uid);
        window.AmanUI.toast("Volunteer assigned.");
        renderRoster(el);
      };
    });
    el.querySelectorAll("[data-del-slot]").forEach(function (b) {
      b.onclick = function () {
        if (confirm("Delete this patrol slot and its sign-ups?")) {
          S.removeSlot(b.getAttribute("data-del-slot"));
          renderRoster(el);
        }
      };
    });
  }

  function addSlotModal() {
    var S = window.AmanStore;
    window.AmanUI.modal(
      "<h3>Create patrol slot</h3><p class=\"m-sub\">Patrols run in pairs — the slot opens on the roster for two volunteers to claim.</p>" +
      '<div class="field"><label>Date</label><input type="date" id="ns-date" value="' + S.todayISO() + '" min="' + S.todayISO() + '"></div>' +
      '<div class="grid-2">' +
      '<div class="field"><label>Start time</label><input type="time" id="ns-start" value="18:00"></div>' +
      '<div class="field"><label>End time</label><input type="time" id="ns-end" value="20:00"></div></div>' +
      '<div class="m-actions"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-teal" id="ns-save">Create</button></div>',
      function (root) {
        root.querySelector("#ns-save").onclick = function () {
          var d = root.querySelector("#ns-date").value;
          if (!d) { window.AmanUI.toast("Please choose a date.", "error"); return; }
          var res = S.createSlot({
            date: d,
            start_time: root.querySelector("#ns-start").value,
            end_time: root.querySelector("#ns-end").value,
            created_by: S.sessionUser().id,
            claim_for_creator: false
          });
          if (!res.ok) { window.AmanUI.toast(res.error, "error"); return; }
          window.AmanUI.closeModal();
          window.AmanUI.toast("Patrol slot created.");
          renderRoster(document.getElementById("admin-body"));
        };
      }
    );
  }

  /* ---------------- incidents management ---------------- */
  function renderIncidents(el) {
    var S = window.AmanStore;
    var filter = renderIncidents.filter || "all";
    var list = S.incidents().filter(function (i) { return filter === "all" || i.status === filter; });
    el.innerHTML =
      '<div class="row wrap" style="margin-bottom:12px" id="inc-filter">' +
      ["all"].concat(STATUSES).map(function (f) {
        return '<button class="layer-btn' + (f === filter ? " on" : "") + '" data-f="' + f + '">' + (f === "all" ? "All" : f) + "</button>";
      }).join("") + "</div>" +
      (list.length ? list.map(function (i) {
        var reporter = S.userById(i.user_id);
        return '<div class="card tight inc-row" data-inc="' + i.id + '" style="cursor:pointer">' +
          '<div class="row spread"><div class="grow">' +
          '<div style="font-weight:800;font-size:0.86rem">' + incIcon(i.category) + " " + esc(i.category) + "</div>" +
          '<div class="muted" style="font-size:0.74rem;margin-top:3px">' + esc(S.fmtDateTime(i.created_at)) + " · " + esc(reporter ? reporter.first_name + " " + reporter.surname[0] + "." : "?") + "</div></div>" +
          '<span class="chip ' + statusClass(i.status) + '">' + esc(i.status) + "</span></div>" +
          '<div class="muted" style="font-size:0.76rem;margin-top:6px">' + esc((i.location_address || "") + " · " + (i.zone || "")) + "</div>" +
          "</div>";
      }).join("") : '<div class="empty"><div class="big">' + window.AmanUI.I("list",36) + '</div>No incidents match this filter.</div>');

    el.querySelector("#inc-filter").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-f]");
      if (!b) return;
      renderIncidents.filter = b.getAttribute("data-f");
      renderIncidents(el);
    });
    el.querySelectorAll(".inc-row").forEach(function (r) {
      r.onclick = function () { incidentModal(r.getAttribute("data-inc"), el); };
    });
  }
  renderIncidents.filter = "all";

  function incIcon(cat) {
    if (cat.indexOf("Vehicle") !== -1) return window.AmanUI.I("car", 15);
    if (cat.indexOf("Person") !== -1) return window.AmanUI.I("user", 15);
    return window.AmanUI.I("alert", 15);
  }
  function statusClass(s) {
    if (s === "Resolved") return "ok";
    if (s === "SAPS/Security Notified") return "info";
    if (s === "Acknowledged") return "teal";
    return "warn";
  }

  /* ---------------- incident modal (view / edit) ---------------- */
  function incidentModal(id, listEl) {
    var S = window.AmanStore;
    var ui = window.AmanUI;
    var i = S.incidentById(id);
    if (!i) return;
    var me = S.sessionUser();
    var coord = me && me.role === "coordinator";
    var reporter = S.userById(i.user_id);
    var fieldsHtml = Object.keys(i.fields || {}).map(function (k) {
      return "<div><span class=\"dl-k\">" + esc(k.replace(/_/g, " ")) + "</span><span class=\"dl-v\">" + esc(i.fields[k]) + "</span></div>";
    }).join("");

    var statusHtml = coord
      ? '<div class="field"><label>Status</label><select id="im-status">' + STATUSES.map(function (s) { return "<option" + (s === i.status ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select></div>"
      : '<dl class="kv"><dt>Status</dt><dd><span class="chip ' + statusClass(i.status) + '">' + esc(i.status) + "</span></dd></dl>";

    var responderForm = coord
      ? '<div class="grid-2">' +
        '<div class="field"><label>Responder type</label><select id="im-rtype">' + ["None yet", "SAPS", "EMS/Ambulance", "Armed Response", "Private Security", "Fire"].map(function (t) { return "<option" + (t === i.responder_type ? " selected" : "") + ">" + t + "</option>"; }).join("") + "</select></div>" +
        '<div class="field"><label>Officer / name</label><input id="im-rname" value="' + esc(i.responder_name) + '"></div>' +
        '<div class="field"><label>Vehicle reg</label><input id="im-rreg" value="' + esc(i.vehicle_reg) + '"></div>' +
        '<div class="field"><label>Call sign</label><input id="im-rcs" value="' + esc(i.call_sign) + '"></div></div>' +
        '<div class="field"><label>Contact details</label><input id="im-rcontact" value="' + esc(i.contact_details) + '"></div>' +
        '<div class="field"><label>Outcome / action taken</label><textarea id="im-routcome" style="min-height:64px">' + esc(i.outcome) + "</textarea></div>"
      : '<dl class="kv">' +
        "<dt>Responder</dt><dd>" + esc(i.responder_type + (i.responder_name ? " — " + i.responder_name : "")) + "</dd>" +
        (i.contact_details ? "<dt>Contact</dt><dd>" + esc(i.contact_details) + "</dd>" : "") +
        (i.outcome ? "<dt>Outcome</dt><dd>" + esc(i.outcome) + "</dd>" : "") + "</dl>";

    var body =
      "<h3>" + incIcon(i.category) + " " + esc(i.category) + "</h3>" +
      '<p class="m-sub">Logged ' + esc(S.fmtDateTime(i.created_at)) + " by " + esc(reporter ? reporter.first_name + " " + reporter.surname : "?") + " · " + esc(i.zone || "") + "</p>" +
      '<dl class="kv"><dt>Location</dt><dd>' + esc(i.location_address) + "</dd>" +
      "<dt>GPS</dt><dd>" + esc(i.gps_lat + ", " + i.gps_lng) + "</dd></dl>" +
      (i.photo_url ? '<img src="' + i.photo_url + '" class="photo-preview" alt="Incident photo" style="max-height:180px">' : "") +
      (i.description ? '<div class="field"><label>Description</label><div style="font-size:0.84rem;line-height:1.5">' + esc(i.description) + "</div></div>" : "") +
      (fieldsHtml ? '<div class="detail-list" style="margin-bottom:12px">' + fieldsHtml + "</div>" : "") +
      statusHtml +
      '<div class="divider"></div><h3 style="font-size:0.92rem">Response &amp; handover</h3>' +
      responderForm +
      '<div class="m-actions"><button class="btn btn-ghost" data-close>Close</button>' +
      (coord ? '<button class="btn btn-teal" id="im-save">Save changes</button>' : "") + "</div>";

    ui.modal(body, function (root) {
      if (!coord) return;
      root.querySelector("#im-save").onclick = function () {
        S.updateIncident(id, {
          status: root.querySelector("#im-status").value,
          responder_type: root.querySelector("#im-rtype").value,
          responder_name: root.querySelector("#im-rname").value.trim(),
          vehicle_reg: root.querySelector("#im-rreg").value.trim(),
          call_sign: root.querySelector("#im-rcs").value.trim(),
          contact_details: root.querySelector("#im-rcontact").value.trim(),
          outcome: root.querySelector("#im-routcome").value.trim()
        });
        ui.closeModal();
        ui.toast("Incident updated. Reporter notified of status change.", "ok");
        ui.refreshBell();
        if (listEl) renderIncidents(listEl);
      };
    });
  }

  /* ---------------- reports ---------------- */
  function renderReports(el) {
    var S = window.AmanStore;
    var f = REPORT_FILTER;

    function daysAgoISO(n) {
      var d = new Date(); d.setDate(d.getDate() - n);
      return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    }
    if (!f.from) f.from = daysAgoISO(30);
    if (!f.to) f.to = S.todayISO();

    var list = S.incidents().filter(function (i) {
      var d = i.created_at.slice(0, 10);
      if (f.from && d < f.from) return false;
      if (f.to && d > f.to) return false;
      if (f.category && i.category !== f.category) return false;
      if (f.status && i.status !== f.status) return false;
      return true;
    });

    var counts = { "Suspicious Vehicle (VOI)": 0, "Suspicious Person (POI)": 0, "Incident (SOI)": 0 };
    list.forEach(function (i) { counts[i.category] = (counts[i.category] || 0) + 1; });
    var byStatus = {};
    list.forEach(function (i) { byStatus[i.status] = (byStatus[i.status] || 0) + 1; });

    var shifts = S.completedShifts();

    el.innerHTML =
      '<div class="card tight">' +
      '<h3 style="font-size:0.9rem">Filters</h3>' +
      '<div class="grid-2">' +
      '<div class="field"><label>From</label><input type="date" id="rf-from" value="' + f.from + '"></div>' +
      '<div class="field"><label>To</label><input type="date" id="rf-to" value="' + f.to + '"></div></div>' +
      '<div class="grid-2">' +
      '<div class="field"><label>Category</label><select id="rf-cat"><option value="">All categories</option>' + Object.keys(counts).map(function (c) { return '<option' + (f.category === c ? " selected" : "") + ">" + c + "</option>"; }).join("") + "</select></div>" +
      '<div class="field"><label>Status</label><select id="rf-status"><option value="">All statuses</option>' + STATUSES.map(function (s) { return '<option' + (f.status === s ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select></div></div>" +
      '<button class="btn btn-primary block" id="rf-apply">Apply filters</button></div>' +

      '<div class="stat-grid">' +
      '<div class="stat"><div class="s-num">' + list.length + '</div><div class="s-label">Total</div></div>' +
      '<div class="stat"><div class="s-num">' + counts["Suspicious Vehicle (VOI)"] + '</div><div class="s-label">Vehicles</div></div>' +
      '<div class="stat"><div class="s-num">' + counts["Suspicious Person (POI)"] + '</div><div class="s-label">Persons</div></div>' +
      '<div class="stat"><div class="s-num">' + counts["Incident (SOI)"] + '</div><div class="s-label">Incidents</div></div></div>' +

      (Object.keys(byStatus).length ? '<div class="card tight"><div class="detail-list">' + STATUSES.filter(function (s) { return byStatus[s]; }).map(function (s) {
        return '<div><span class="dl-k">' + s + '</span><span class="dl-v">' + byStatus[s] + "</span></div>";
      }).join("") + "</div></div>" : "") +

      '<button class="btn btn-teal block" id="csv-btn" style="margin-bottom:12px">' + window.AmanUI.I("download",16) + ' Export incidents as CSV</button>' +

      '<h3 style="font-size:0.95rem;margin:4px 0 8px">Incidents (' + list.length + ")</h3>" +
      '<div class="card tight tbl-wrap"><table class="tbl"><tr><th>When</th><th>Category</th><th>Zone</th><th>Status</th></tr>' +
      (list.map(function (i) {
        return "<tr><td>" + esc(S.fmtDateTime(i.created_at)) + "</td><td>" + esc(i.category.replace(" (", "<br>(")) + "</td><td>" + esc((i.zone || "").replace("Zone ", "")) + "</td><td>" + esc(i.status) + "</td></tr>";
      }).join("") || '<tr><td colspan="4" class="center">No incidents in range</td></tr>') +
      "</table></div>" +

      '<h3 style="font-size:0.95rem;margin:16px 0 8px">Completed shifts (' + shifts.length + ")</h3>" +
      '<div class="card tight tbl-wrap"><table class="tbl"><tr><th>Volunteer</th><th>Shift</th><th>Start</th><th>End</th><th>Duration</th></tr>' +
      (shifts.map(function (c) {
        var dur = "";
        if (c.start_shift_time && c.end_shift_time) {
          var mins = Math.round((new Date(c.end_shift_time) - new Date(c.start_shift_time)) / 60000);
          dur = (mins >= 60 ? Math.floor(mins / 60) + "h " : "") + (mins % 60) + "m";
        }
        return "<tr><td>" + esc(c.user.first_name + " " + c.user.surname) + "</td><td>" +
          esc(c.slot ? c.slot.zone.replace("Zone ", "") + " · " + c.slot.activity_window + " · " + S.fmtDate(c.slot.date) : "?") +
          "</td><td>" + esc(S.fmtDateTime(c.start_shift_time)) + "</td><td>" + esc(S.fmtDateTime(c.end_shift_time)) + "</td><td>" + dur + "</td></tr>";
      }).join("") || '<tr><td colspan="5" class="center">No completed shifts yet — start and end a shift from the Roster screen.</td></tr>') +
      "</table></div>";

    document.getElementById("rf-apply").onclick = function () {
      f.from = document.getElementById("rf-from").value;
      f.to = document.getElementById("rf-to").value;
      f.category = document.getElementById("rf-cat").value;
      f.status = document.getElementById("rf-status").value;
      renderReports(el);
    };
    document.getElementById("csv-btn").onclick = function () {
      var csv = S.incidentsCSV();
      var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "aman-patrol-incidents-" + S.todayISO() + ".csv";
      document.body.appendChild(a); a.click(); a.remove();
      window.AmanUI.toast("CSV downloaded.", "ok");
    };
  }

  window.AmanAdmin = { render: render, incidentModal: incidentModal };
})();

</script>
  <script>
/* ============================================================
   AMAN PATROL — live data layer (Supabase)
   ------------------------------------------------------------
   Replaces the localStorage demo store (js/store.js) with the
   same API backed by the coordinator's Supabase project, so no
   screen or component has to change.

   How it works:
   - window.AmanStore is re-pointed here at load time when
     js/config.js has a project AND the Supabase client library
     is present. Add ?demo=1 to the page URL to keep the demo.
   - Reads are served SYNCHRONOUSLY from an in-memory cache that
     is loaded during boot() and refreshed by Supabase Realtime
     (notifications, roster, claims) — the app re-renders through
     the onChange hook.
   - Writes are optimistic: they update the cache and return
     immediately, then sync in the background. Failures surface
     as a toast and the cache is re-fetched from the server.
   - login() and register() return Promises (the only async
     entry points the app awaits explicitly).
   - Privacy: volunteers see first name + surname initial of
     other volunteers (the volunteer_public view). Full details
     stay coordinator-only, exactly like the RLS policies.
   ============================================================ */
(function () {
  var cfg = window.AMAN_SUPABASE;
  if (!cfg || !cfg.url || !cfg.anonKey) return;
  if (typeof window.supabase === "undefined" || !window.supabase.createClient) return;
  if (/[?&#]demo(=1)?([&#]|$)/.test(window.location.search + window.location.hash)) return;

  var Demo = window.AmanStore; // demo store: reused for pure helpers
  var sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
    auth: { persistSession: true, autoRefreshToken: true }
  });

  /* ---------------- state cache ---------------- */
  var me = null;                 // my profiles row
  var users = [];                // full profiles (coordinator: everyone; volunteer: just me)
  var volMap = {};               // id -> { first_name, surname } from volunteer_public
  var slots = [];
  var claims = [];
  var notifs = [];               // mapped rows (demo shape)
  var readIds = {};              // notification_id -> true (mine)
  var incidents = [];
  var pins = [];
  var msgRows = [];
  var settings = {};
  var sosLog = [];
  var listeners = [];
  var booted = false;
  var tmpId = 0;
  var refreshTimers = {};
  var signedCache = {};          // storage path -> { url, exp }

  /* ---------------- tiny helpers ---------------- */
  function notify() { for (var i = 0; i < listeners.length; i++) { try { listeners[i](); } catch (e) {} } }
  function esc(s) { return String(s == null ? "" : s); }

  function toastUI(msg, kind) {
    try {
      var d = document.createElement("div");
      d.textContent = msg;
      d.setAttribute("style", "position:fixed;left:50%;bottom:78px;transform:translateX(-50%);" +
        "background:#7a1f1f;color:#fff;padding:10px 16px;border-radius:10px;font-size:0.82rem;" +
        "z-index:9999;max-width:88vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);font-family:inherit");
      if (kind === "ok") d.style.background = "#0e6e5c";
      document.body.appendChild(d);
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 4200);
    } catch (e) { console.warn(msg); }
  }

  function refreshSoon(tag) {
    if (refreshTimers[tag]) clearTimeout(refreshTimers[tag]);
    refreshTimers[tag] = setTimeout(function () {
      refreshTimers[tag] = null;
      refresh(tag);
    }, 1200);
  }

  function refresh(tag) {
    if (!me || me.status !== "approved") { if (tag === "notifications") loadNotifs(); return; }
    if (tag === "notifications") loadNotifs().then(notify, notify);
    else if (tag === "roster") Promise.all([loadSlots(), loadClaims(), loadVolMap()]).then(notify, notify);
    else if (tag === "incidents") loadIncidents().then(notify, notify);
    else if (tag === "users") loadUsers().then(notify, notify);
    else if (tag === "settings") loadSettings().then(notify, notify);
    else if (tag === "pins") loadPins().then(notify, notify);
    else if (tag === "messages") loadMessages().then(notify, notify);
  }

  function dbError(r, fallback) {
    if (r && r.error) { console.warn("Aman live:", r.error.message); return r.error.message; }
    return fallback || "Could not reach the server. Check your connection and try again.";
  }

  /* ---------------- loaders ---------------- */
  function loadProfile() {
    return sb.auth.getSession().then(function (res) {
      var s = res && res.data && res.data.session;
      if (!s || !s.user) { me = null; users = []; return null; }
      var uid = s.user.id;
      return sb.from("profiles").select("*").eq("id", uid).maybeSingle().then(function (r) {
        if (r.error || !r.data) { me = null; return null; }
        me = r.data;
        return me;
      });
    });
  }

  function loadUsers() {
    if (!me) { users = []; return Promise.resolve(); }
    if (me.role !== "coordinator") { users = [me]; return Promise.resolve(); }
    return sb.from("profiles").select("*").order("created_at", { ascending: true }).then(function (r) {
      if (!r.error && r.data) users = r.data;
    });
  }

  function loadVolMap() {
    if (!me || me.status !== "approved") { volMap = {}; return Promise.resolve(); }
    return sb.from("volunteer_public").select("id,first_name,surname_initial").then(function (r) {
      volMap = {};
      if (!r.error && r.data) {
        for (var i = 0; i < r.data.length; i++) {
          var v = r.data[i];
          // surname carries the initial WITHOUT the trailing dot, so
          // surname[0] + "." renders like the demo roster.
          volMap[v.id] = { id: v.id, first_name: v.first_name, surname: String(v.surname_initial || "?").replace(/\.$/, "") };
        }
      }
    });
  }

  function loadSlots() {
    if (!me || me.status !== "approved") { slots = []; return Promise.resolve(); }
    return sb.from("patrol_slots").select("*").order("date", { ascending: true }).then(function (r) {
      if (!r.error && r.data) slots = r.data;
    });
  }

  function loadClaims() {
    if (!me || me.status !== "approved") { claims = []; return Promise.resolve(); }
    return sb.from("slot_claims").select("*").then(function (r) {
      if (!r.error && r.data) claims = r.data;
    });
  }

  function loadIncidents() {
    if (!me || me.status !== "approved") { incidents = []; return Promise.resolve(); }
    return sb.from("incidents").select("*").order("created_at", { ascending: false }).limit(200).then(function (r) {
      if (!r.error && r.data) {
        incidents = r.data;
        for (var i = 0; i < incidents.length; i++) resolvePhoto(incidents[i]);
      }
    });
  }

  function loadPins() {
    if (!me || me.status !== "approved") { pins = []; return Promise.resolve(); }
    return sb.from("map_pins").select("*").then(function (r) {
      if (!r.error && r.data) pins = r.data;
    });
  }

  function loadSettings() {
    if (!me || me.status !== "approved") { settings = {}; return Promise.resolve(); }
    return sb.from("settings").select("key,value").then(function (r) {
      settings = {};
      if (!r.error && r.data) for (var i = 0; i < r.data.length; i++) settings[r.data[i].key] = r.data[i].value;
    });
  }

  function loadNotifs() {
    if (!me) { notifs = []; return Promise.resolve(); }
    return sb.from("notifications").select("*").order("created_at", { ascending: false }).limit(200).then(function (r) {
      if (r.error || !r.data) return;
      notifs = [];
      for (var i = 0; i < r.data.length; i++) {
        var n = r.data[i];
        notifs.push({
          id: n.id,
          audience: { type: n.audience, id: n.user_id },
          kind: n.kind, title: n.title, body: n.body || "", link: n.link || null,
          created_at: n.created_at, read_by: readIds[n.id] ? [me.id] : []
        });
      }
      return sb.from("notification_reads").select("notification_id").eq("user_id", me.id).then(function (rr) {
        if (!rr.error && rr.data) {
          readIds = {};
          for (var j = 0; j < rr.data.length; j++) readIds[rr.data[j].notification_id] = true;
          for (var k = 0; k < notifs.length; k++) notifs[k].read_by = readIds[notifs[k].id] ? [me.id] : [];
        }
      });
    });
  }

  function loadMessages() {
    if (!me || me.status !== "approved") { msgRows = []; return Promise.resolve(); }
    return sb.from("messages").select("*").order("created_at", { ascending: true }).limit(200).then(function (r) {
      if (!r.error && r.data) msgRows = r.data;
    });
  }

  function loadSosLog() {
    if (!me || me.status !== "approved") { sosLog = []; return Promise.resolve(); }
    return sb.from("sos_log").select("*").order("created_at", { ascending: false }).limit(50).then(function (r) {
      if (!r.error && r.data) sosLog = r.data;
    });
  }

  function loadAll() {
    var jobs = [loadUsers(), loadVolMap(), loadNotifs()];
    if (me && me.status === "approved") {
      jobs = jobs.concat([loadSlots(), loadClaims(), loadIncidents(), loadPins(), loadSettings(), loadSosLog(), loadMessages()]);
    }
    return Promise.all(jobs);
  }

  /* ---------------- photos (private bucket, signed URLs) ---------------- */
  function resolvePhoto(row) {
    var p = row.photo_url;
    if (!p || typeof p !== "string" || p.slice(0, 5) === "data:" || p.slice(0, 4) === "http") return;
    row._photo_path = p;
    var hit = signedCache[p];
    if (hit && hit.exp > Date.now()) { row.photo_url = hit.url; return; }
    sb.storage.from("incident-photos").createSignedUrl(p, 3600).then(function (r) {
      if (r && r.data && r.data.signedUrl) {
        signedCache[p] = { url: r.data.signedUrl, exp: Date.now() + 50 * 60 * 1000 };
        if (row._photo_path === p) { row.photo_url = r.data.signedUrl; notify(); }
      }
    });
  }

  function dataUrlToBlob(dataUrl) {
    try { return fetch(dataUrl).then(function (r) { return r.blob(); }); }
    catch (e) { return Promise.resolve(null); }
  }

  function uploadPhoto(dataUrl) {
    return dataUrlToBlob(dataUrl).then(function (blob) {
      if (!blob) return { ok: false };
      var path = me.id + "/" + Date.now() + ".jpg";
      return sb.storage.from("incident-photos").upload(path, blob, { contentType: "image/jpeg", upsert: false })
        .then(function (r) {
          if (r.error) { console.warn("photo upload failed:", r.error.message); return { ok: false }; }
          return { ok: true, path: path };
        });
    });
  }

  /* ---------------- view builders (demo shapes) ---------------- */
  function volLabel(id) {
    if (me && id === me.id) return me;
    if (volMap[id]) return volMap[id];
    for (var i = 0; i < users.length; i++) if (users[i].id === id) return users[i];
    return { id: id, first_name: "Volunteer", surname: "?" };
  }

  function claimView(c) {
    var out = {};
    for (var k in c) out[k] = c[k];
    out.user = volLabel(c.user_id);
    out.start_gps = (c.start_gps_lat != null && c.start_gps_lng != null) ? { lat: c.start_gps_lat, lng: c.start_gps_lng } : null;
    out.end_gps = (c.end_gps_lat != null && c.end_gps_lng != null) ? { lat: c.end_gps_lat, lng: c.end_gps_lng } : null;
    return out;
  }

  function slotView(s) {
    var cs = [];
    for (var i = 0; i < claims.length; i++) {
      if (claims[i].slot_id === s.id && claims[i].status !== "cancelled") cs.push(claimView(claims[i]));
    }
    return {
      id: s.id, zone: s.zone, activity_window: s.activity_window, date: s.date,
      time_window: s.time_window, min_required: s.min_required, created_by: s.created_by || null,
      claims: cs, count: cs.length,
      understaffed: cs.length < s.min_required,
      full: cs.length >= s.min_required
    };
  }

  /* ---------------- auth ---------------- */
  function sessionUser() { return me; }

  function login(email, password) {
    email = String(email || "").trim().toLowerCase();
    return sb.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
      if (res.error) {
        var m = res.error.message || "";
        if (/invalid login credentials/i.test(m)) return { ok: false, error: "Incorrect email or password. Please try again." };
        if (/not confirmed/i.test(m)) return { ok: false, error: "Please confirm your email first (check your inbox)." };
        return { ok: false, error: "Could not sign in: " + m };
      }
      return loadProfile().then(function () {
        if (!me) return { ok: false, error: "Signed in, but your profile is missing. Please contact the coordinator." };
        return loadAll().then(function () {
          notify();
          return { ok: true, user: me };
        });
      });
    });
  }

  function logout() {
    me = null; users = []; volMap = {}; slots = []; claims = []; notifs = [];
    readIds = {}; incidents = []; pins = []; settings = {}; sosLog = []; signedCache = {};
    sb.auth.signOut();
    notify();
  }

  function register(data) {
    var email = String(data.email || "").trim().toLowerCase();
    if (!email || !data.password) return Promise.resolve({ ok: false, error: "Email and password are required." });
    return sb.auth.signUp({
      email: email,
      password: data.password,
      options: {
        data: {
          first_name: data.first_name, surname: data.surname, whatsapp: data.whatsapp,
          street: data.street, suburb: data.suburb, dob: data.dob,
          emergency_contact_name: data.emergency_contact_name,
          emergency_contact_number: data.emergency_contact_number
        }
      }
    }).then(function (res) {
      if (res.error) {
        var m = res.error.message || "";
        if (/already registered/i.test(m)) return { ok: false, error: "An account with this email already exists. Please log in instead." };
        if (/password/i.test(m) && /at least/i.test(m)) return { ok: false, error: "Please choose a password of at least 8 characters." };
        return { ok: false, error: "Could not register: " + m };
      }
      if (!res.data || !res.data.session) {
        return { ok: false, error: "Registered, but no session was returned — please log in." };
      }
      return loadProfile().then(function () {
        if (!me) return { ok: false, error: "Registered, but your profile could not be created. Please contact the coordinator." };
        return loadAll().then(function () { notify(); return { ok: true, user: me }; });
      });
    });
  }

  /* ---------------- users (coordinator) ---------------- */
  function listUsers() { return users.slice(); }
  function userById(id) {
    for (var i = 0; i < users.length; i++) if (users[i].id === id) return users[i];
    return volMap[id] || null;
  }
  function userLabel(id) {
    var u = userById(id);
    return u ? u.first_name + " " + u.surname : "Unknown";
  }

  function approveUser(id) {
    for (var i = 0; i < users.length; i++) if (users[i].id === id) users[i].status = "approved";
    notify();
    sb.from("profiles").update({ status: "approved" }).eq("id", id).then(function (r) {
      if (r.error) { toastUI("Could not approve: " + r.error.message); refreshSoon("users"); return; }
      var u = userById(id);
      pushNotif({
        audience: { type: "user", id: id }, kind: "ok", title: "Your registration was approved",
        body: "Welcome to Aman Patrol, " + (u ? u.first_name : "volunteer") + ". You can now claim patrol slots. Remember: observe and report only — never patrol alone."
      });
      refreshSoon("users"); refreshSoon("roster");
    });
  }

  function declineUser(id) {
    for (var i = 0; i < users.length; i++) if (users[i].id === id) users[i].status = "declined";
    notify();
    sb.from("profiles").update({ status: "declined" }).eq("id", id).then(function (r) {
      if (r.error) { toastUI("Could not decline: " + r.error.message); }
      refreshSoon("users");
    });
  }

  /* ---------------- patrol slots ---------------- */
  function listSlots() {
    return slots.slice().map(slotView).sort(function (a, b) {
      return Demo.slotStartISO(a) - Demo.slotStartISO(b);
    });
  }
  function slotById(id) {
    for (var i = 0; i < slots.length; i++) if (String(slots[i].id) === String(id)) return slotView(slots[i]);
    return null;
  }

  function createSlot(data) {
    if (!me) return { ok: false, error: "You are not signed in." };
    if (!data || !data.date) return { ok: false, error: "Choose a date." };
    if (data.date < Demo.todayISO()) return { ok: false, error: "Choose today or a future date." };
    if (!data.start_time || !data.end_time) return { ok: false, error: "Choose a start and an end time." };
    if (String(data.end_time) <= String(data.start_time)) return { ok: false, error: "The end time must be after the start time." };
    var temp = {
      id: "tmp-s-" + (++tmpId), zone: null, activity_window: "Volunteer patrol",
      date: data.date, time_window: data.start_time + "\u2013" + data.end_time,
      min_required: 2, created_by: me.id
    };
    slots.push(temp);
    notify();
    var done = sb.from("patrol_slots").insert({
      zone: null, activity_window: temp.activity_window, date: temp.date,
      time_window: temp.time_window, min_required: temp.min_required, created_by: me.id
    }).select().single().then(function (r) {
      slots = slots.filter(function (s) { return s.id !== temp.id; });
      if (r.error) {
        toastUI("Could not create the slot: " + dbError(r));
        notify();
        return;
      }
      slots.push(r.data);
      var claim = { slot_id: r.data.id, user_id: me.id, status: "claimed" };
      return sb.from("slot_claims").insert(claim).then(function () {
        pushNotif({
          audience: { type: "all" }, kind: "info", title: "New patrol slot on the roster",
          body: me.first_name + " scheduled a patrol on " + Demo.fmtDate(r.data.date) + ", " + r.data.time_window + ". One more volunteer is needed to make a pair."
        });
        refreshSoon("roster");
      });
    });
    return { ok: true, slot: slotView(temp), done: done };
  }

  function deleteOwnSlot(slotId, userId) {
    var before = slots.slice();
    slots = slots.filter(function (s) { return String(s.id) !== String(slotId); });
    claims = claims.filter(function (c) { return String(c.slot_id) !== String(slotId); });
    notify();
    sb.from("patrol_slots").delete().eq("id", slotId).then(function (r) {
      if (r.error) {
        toastUI("Could not delete — another volunteer may have joined. Refreshing.");
        slots = before;
        refreshSoon("roster");
      } else {
        refreshSoon("roster");
      }
    });
    return { ok: true };
  }

  function claimSlot(slotId, userId) {
    for (var i = 0; i < claims.length; i++) {
      if (String(claims[i].slot_id) === String(slotId) && claims[i].user_id === userId && claims[i].status !== "cancelled")
        return { ok: false, error: "You have already claimed this slot." };
    }
    var slot = null;
    for (var j = 0; j < slots.length; j++) if (String(slots[j].id) === String(slotId)) slot = slots[j];
    if (!slot) return { ok: false, error: "Slot not found." };
    var view = slotView(slot);
    if (view.count >= view.min_required) return { ok: false, error: "This slot already has a full pair." };
    claims.push({ id: "tmp-c-" + (++tmpId), slot_id: slot.id, user_id: userId, status: "claimed", start_shift_time: null, end_shift_time: null, start_gps_lat: null, start_gps_lng: null, end_gps_lat: null, end_gps_lng: null, created_at: new Date().toISOString() });
    notify();
    sb.from("slot_claims").insert({ slot_id: slot.id, user_id: userId, status: "claimed" }).then(function (r) {
      if (r.error) {
        toastUI("Could not join — the slot may have just filled up. Refreshing.");
        refreshSoon("roster");
        return;
      }
      var after = slotView(slot);
      var where = slot.zone ? " (" + slot.zone + ")" : "";
      if (after.understaffed) {
        pushNotif({ audience: { type: "all" }, kind: "warn", title: "A patrol slot is understaffed", body: Demo.fmtDate(slot.date) + " " + slot.time_window.split("\u2013")[0] + " — " + slot.activity_window + where + " needs one more volunteer." });
      } else {
        pushNotif({ audience: { type: "all" }, kind: "ok", title: "Patrol slot fully staffed", body: slot.activity_window + " on " + Demo.fmtDate(slot.date) + where + " now has a full pair. Barakallahu feekum." });
      }
      refreshSoon("roster");
    });
    return { ok: true };
  }

  function unclaim(slotId, userId) {
    var mine = null;
    for (var i = 0; i < claims.length; i++) {
      if (String(claims[i].slot_id) === String(slotId) && claims[i].user_id === userId) mine = claims[i];
    }
    if (!mine) return { ok: false, error: "You are not signed up for this slot." };
    if (mine.status === "started") return { ok: false, error: "Cannot leave a shift that has already started — contact the coordinator." };
    claims = claims.filter(function (c) { return c !== mine; });
    notify();
    if (String(mine.id).indexOf("tmp-") !== 0) {
      sb.from("slot_claims").delete().eq("id", mine.id).then(function (r) {
        if (r.error) { toastUI("Could not leave the slot: " + dbError(r)); refreshSoon("roster"); }
        else refreshSoon("roster");
      });
    }
    return { ok: true };
  }

  function myClaims(userId) {
    var out = [];
    for (var i = 0; i < claims.length; i++) {
      if (claims[i].user_id !== userId) continue;
      var c = claimView(claims[i]);
      c.slot = slotById(c.slot_id) || null;
      if (c.slot) c.slot = rawSlot(c.slot_id);
      out.push(c);
    }
    return out.sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
  }
  function rawSlot(id) {
    for (var i = 0; i < slots.length; i++) if (String(slots[i].id) === String(id)) return slots[i];
    return null;
  }
  function myClaimFor(slotId, userId) {
    var list = myClaims(userId);
    for (var i = 0; i < list.length; i++) if (String(list[i].slot_id) === String(slotId)) return list[i];
    return null;
  }

  function startShift(slotId, userId, gps) {
    var c = myClaimFor(slotId, userId);
    if (!c) return { ok: false, error: "Claim this slot first." };
    if (c.status === "started") return { ok: false, error: "Shift already started." };
    if (c.status === "completed") return { ok: false, error: "This shift is already completed." };
    var now = new Date().toISOString();
    c.status = "started"; c.start_shift_time = now; c.start_gps = gps;
    notify();
    if (String(c.id).indexOf("tmp-") !== 0) {
      sb.from("slot_claims").update({
        status: "started", start_shift_time: now,
        start_gps_lat: gps ? gps.lat : null, start_gps_lng: gps ? gps.lng : null
      }).eq("id", c.id).then(function (r) { if (r.error) toastUI("Could not record shift start: " + dbError(r)); });
    }
    return { ok: true, start_shift_time: now };
  }

  function endShift(slotId, userId, gps) {
    var c = myClaimFor(slotId, userId);
    if (!c || c.status !== "started") return { ok: false, error: "Start the shift first." };
    var now = new Date().toISOString();
    c.status = "completed"; c.end_shift_time = now; c.end_gps = gps;
    notify();
    if (String(c.id).indexOf("tmp-") !== 0) {
      sb.from("slot_claims").update({
        status: "completed", end_shift_time: now,
        end_gps_lat: gps ? gps.lat : null, end_gps_lng: gps ? gps.lng : null
      }).eq("id", c.id).then(function (r) { if (r.error) toastUI("Could not record shift end: " + dbError(r)); });
    }
    return { ok: true, end_shift_time: now };
  }

  function completedShifts() {
    var out = [];
    for (var i = 0; i < claims.length; i++) {
      if (claims[i].status !== "completed") continue;
      var c = claimView(claims[i]);
      c.slot = rawSlot(c.slot_id);
      out.push(c);
    }
    return out.sort(function (a, b) { return new Date(b.end_shift_time || 0) - new Date(a.end_shift_time || 0); });
  }

  /* coordinator roster tools */
  function addSlot(data) {
    var temp = {
      id: "tmp-s-" + (++tmpId), zone: data.zone, activity_window: data.activity_window,
      date: data.date, time_window: data.time_window, min_required: data.min_required || 2, created_by: me.id
    };
    slots.push(temp);
    notify();
    sb.from("patrol_slots").insert({
      zone: data.zone, activity_window: data.activity_window, date: data.date,
      time_window: data.time_window, min_required: data.min_required || 2, created_by: me.id
    }).select().single().then(function (r) {
      slots = slots.filter(function (s) { return s.id !== temp.id; });
      if (r.error) { toastUI("Could not add slot: " + dbError(r)); }
      else { slots.push(r.data); refreshSoon("roster"); }
      notify();
    });
    return temp;
  }
  function removeSlot(id) {
    var before = slots.slice();
    slots = slots.filter(function (s) { return String(s.id) !== String(id); });
    claims = claims.filter(function (c) { return String(c.slot_id) !== String(id); });
    notify();
    sb.from("patrol_slots").delete().eq("id", id).then(function (r) {
      if (r.error) { slots = before; toastUI("Could not remove slot: " + dbError(r)); }
      notify();
    });
  }
  function assignVolunteer(slotId, userId) { return claimSlot(slotId, userId); }
  function removeClaim(claimId) {
    var before = claims.slice();
    claims = claims.filter(function (c) { return String(c.id) !== String(claimId); });
    notify();
    sb.from("slot_claims").delete().eq("id", claimId).then(function (r) {
      if (r.error) { claims = before; toastUI("Could not remove: " + dbError(r)); }
      else refreshSoon("roster");
      notify();
    });
  }

  /* ---------------- SOS ---------------- */
  function raiseSOS(userId, gps) {
    if (!me) return { ok: false, error: "You are not signed in." };
    var onDuty = 0;
    for (var i = 0; i < claims.length; i++) {
      if (claims[i].status === "started" && claims[i].user_id !== userId) onDuty++;
    }
    var rec = { id: "tmp-sos-" + (++tmpId), user_id: userId, lat: gps.lat, lng: gps.lng, accuracy: gps.accuracy || null, created_at: new Date().toISOString() };
    sosLog.unshift(rec);
    if (sosLog.length > 50) sosLog.length = 50;
    var maps = "https://www.google.com/maps/dir/?api=1&destination=" + gps.lat + "," + gps.lng;
    pushNotif({
      audience: { type: "all" }, kind: "sos", link: maps,
      title: "SOS — " + me.first_name + " needs help",
      body: me.first_name + " " + (me.surname || "?").charAt(0) + ". sent an SOS at " + Demo.fmtTime(rec.created_at) +
        " (GPS " + Number(gps.lat).toFixed(5) + ", " + Number(gps.lng).toFixed(5) + "). " +
        (onDuty
          ? onDuty + " patroller" + (onDuty > 1 ? "s are" : " is") + " on duty — please respond and route to the position."
          : "No patrollers are on duty right now — coordinator, please arrange armed response and check on them.") +
        " Use the route button to navigate there."
    });
    notify();
    sb.from("sos_log").insert({ user_id: userId, lat: gps.lat, lng: gps.lng, accuracy: gps.accuracy || null })
      .then(function (r) { if (r.error) toastUI("Warning: the SOS could not be saved to the log — it was still sent to the team."); });
    return { ok: true, sos: rec, on_duty: onDuty };
  }

  /* ---------------- settings ---------------- */
  function getSetting(key) { return settings[key] || ""; }
  function setSetting(key, value) {
    if (!me) return;
    settings[key] = String(value || "");
    notify();
    sb.from("settings").upsert({ key: key, value: String(value || ""), updated_by: me.id })
      .then(function (r) { if (r.error) toastUI("Could not save setting: " + dbError(r)); });
  }

  /* ---------------- incidents ---------------- */
  function listIncidents() { return incidents.slice(); }
  function incidentById(id) {
    for (var i = 0; i < incidents.length; i++) if (String(incidents[i].id) === String(id)) return incidents[i];
    return null;
  }

  function addIncident(data) {
    if (!me) return { ok: false, error: "You are not signed in." };
    var zone = data.zone || Demo.zoneOfCoords(data.gps_lat, data.gps_lng);
    var temp = {
      id: "tmp-i-" + (++tmpId), user_id: data.user_id, category: data.category, status: "Logged",
      gps_lat: data.gps_lat, gps_lng: data.gps_lng, zone: zone,
      location_address: data.location_address || "", description: data.description || "",
      photo_url: data.photo_url || null,
      responder_type: data.responder_type || "None yet", responder_name: data.responder_name || "",
      vehicle_reg: data.vehicle_reg || "", call_sign: data.call_sign || "",
      contact_details: data.contact_details || "", arrival_time: data.arrival_time || null, outcome: data.outcome || "",
      fields: data.fields || {}, created_at: new Date().toISOString()
    };
    incidents.unshift(temp);
    notify();
    var done = Promise.resolve(null).then(function () {
      if (!data.photo_url || String(data.photo_url).slice(0, 5) !== "data:") return { path: null };
      return uploadPhoto(data.photo_url);
    }).then(function (up) {
      var row = {
        user_id: temp.user_id, category: temp.category, status: "Logged",
        gps_lat: temp.gps_lat, gps_lng: temp.gps_lng, zone: zone,
        location_address: temp.location_address, description: temp.description,
        photo_url: (up && up.ok) ? up.path : null,
        responder_type: temp.responder_type, responder_name: temp.responder_name,
        vehicle_reg: temp.vehicle_reg, call_sign: temp.call_sign,
        contact_details: temp.contact_details, arrival_time: temp.arrival_time, outcome: temp.outcome,
        fields: temp.fields
      };
      if (data.photo_url && (!up || !up.ok)) toastUI("The photo could not be uploaded — the report was still sent.", "ok");
      return sb.from("incidents").insert(row).select().single().then(function (r) {
        incidents = incidents.filter(function (x) { return x.id !== temp.id; });
        if (r.error) { toastUI("Could not send the report: " + dbError(r)); notify(); return { ok: false }; }
        incidents.unshift(r.data);
        resolvePhoto(r.data);
        notify();
        pushNotif({
          audience: { type: "all" }, kind: "danger", title: "New incident logged in " + zone,
          body: temp.category + " reported by " + me.first_name + (temp.location_address ? " — " + temp.location_address : ".") + " Coordinator to acknowledge."
        });
        return { ok: true };
      });
    });
    return { ok: true, incident: temp, done: done };
  }

  function updateIncident(id, patch) {
    var inc = incidentById(id);
    if (!inc) return;
    var clean = {};
    for (var k in patch) if (patch.hasOwnProperty(k) && ["status", "responder_type", "responder_name", "vehicle_reg", "call_sign", "contact_details", "arrival_time", "outcome"].indexOf(k) >= 0) clean[k] = patch[k];
    var prevStatus = inc.status;
    for (var k2 in clean) inc[k2] = clean[k2];
    notify();
    if (String(id).indexOf("tmp-") === 0) return; // still being created; skip
    sb.from("incidents").update(clean).eq("id", id).then(function (r) {
      if (r.error) { toastUI("Could not update incident: " + dbError(r)); refreshSoon("incidents"); return; }
      if (clean.status && clean.status !== prevStatus) {
        pushNotif({
          audience: { type: "user", id: inc.user_id }, kind: clean.status === "Resolved" ? "ok" : "info",
          title: "Incident status updated: " + clean.status,
          body: "Your " + inc.category + " report has been marked \"" + clean.status + "\"."
        });
      }
      refreshSoon("incidents");
    });
  }

  /* ---------------- map pins ---------------- */
  function listPins() { return pins.slice(); }
  function addPin(pin) {
    if (!me) return null;
    var p = { id: "tmp-p-" + (++tmpId), label: pin.label, type: pin.type, lat: pin.lat, lng: pin.lng, created_by: me.id, created_at: new Date().toISOString() };
    pins.push(p);
    notify();
    sb.from("map_pins").insert({ label: pin.label, type: pin.type, lat: pin.lat, lng: pin.lng, created_by: me.id })
      .select().single().then(function (r) {
        pins = pins.filter(function (x) { return x.id !== p.id; });
        if (r.error) toastUI("Could not add pin: " + dbError(r));
        else pins.push(r.data);
        notify();
      });
    return p;
  }
  function removePin(id) {
    var before = pins.slice();
    pins = pins.filter(function (p) { return String(p.id) !== String(id); });
    notify();
    sb.from("map_pins").delete().eq("id", id).then(function (r) {
      if (r.error) { pins = before; toastUI("Could not remove pin: " + dbError(r)); notify(); }
    });
  }

  /* ---------------- notifications ---------------- */
  function pushNotif(n) {
    var kind = n.kind || "info";
    if (kind === "danger" && (!me || me.role !== "coordinator")) kind = "warn"; // RLS: volunteers post info/ok/warn/sos
    var aud = n.audience || { type: "all" };
    var optimistic = {
      id: "tmp-n-" + (++tmpId), audience: aud, kind: kind,
      title: n.title, body: n.body || "", link: n.link || null,
      created_at: new Date().toISOString(), read_by: []
    };
    notifs.unshift(optimistic);
    sb.from("notifications").insert({
      audience: aud.type, user_id: aud.type === "user" ? aud.id : null,
      kind: kind, title: n.title, body: n.body || "", link: n.link || null
    }).then(function (r) {
      if (r.error) console.warn("notif not saved:", r.error.message);
      refreshSoon("notifications");
    });
  }

  function notifForMe(n, user) {
    if (!user) return false;
    var a = n.audience;
    if (a.type === "user") return a.id === user.id;
    if (a.type === "coordinator") return user.role === "coordinator";
    return true;
  }
  function notificationsFor(user) {
    return notifs.filter(function (n) { return notifForMe(n, user); })
      .sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
  }
  function unreadCount(user) {
    return notificationsFor(user).filter(function (n) { return n.read_by.indexOf(user.id) === -1; }).length;
  }
  function markAllRead(user) {
    var inserts = [];
    notificationsFor(user).forEach(function (n) {
      if (n.read_by.indexOf(user.id) === -1 && String(n.id).indexOf("tmp-") !== 0) {
        n.read_by = [user.id];
        inserts.push({ notification_id: n.id, user_id: user.id });
      }
    });
    notify();
    if (inserts.length) {
      sb.from("notification_reads").insert(inserts).then(function (r) { if (r.error) console.warn("read state not saved:", r.error.message); });
    }
  }

  /* ---------------- team chat ---------------- */
  var CHAT_SEEN_KEY = "aman-chat-seen";
  function chatSeenAt() {
    try {
      var v = window.localStorage.getItem(CHAT_SEEN_KEY);
      var t = v ? new Date(v).getTime() : 0;
      return isNaN(t) ? 0 : t;
    } catch (e) { return 0; }
  }
  function markChatSeen() {
    try { window.localStorage.setItem(CHAT_SEEN_KEY, new Date().toISOString()); } catch (e) {}
  }
  function listMessages() { return msgRows.slice(); }
  function unreadChatCount(user) {
    if (!user) return 0;
    var seen = chatSeenAt();
    var n = 0;
    for (var i = 0; i < msgRows.length; i++) {
      if (msgRows[i].user_id !== user.id && new Date(msgRows[i].created_at).getTime() > seen) n++;
    }
    return n;
  }
  function sendMessage(userId, body) {
    if (!me) return { ok: false, error: "You are not signed in." };
    body = String(body || "").trim().slice(0, 500);
    if (!body) return { ok: false, error: "Type a message first." };
    msgRows.push({ id: "tmp-m-" + (++tmpId), user_id: userId, body: body, created_at: new Date().toISOString() });
    notify();
    sb.from("messages").insert({ user_id: userId, body: body }).then(function (r) {
      if (r.error) { toastUI("Message not delivered: " + dbError(r)); refreshSoon("messages"); }
      else refreshSoon("messages");
    });
    return { ok: true };
  }

  /* ---------------- CSV export ---------------- */
  function csvEscape(v) {
    if (v === null || v === undefined) return "";
    var s = typeof v === "object" ? JSON.stringify(v) : String(v);
    if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function incidentsCSV() {
    var rows = [["ID", "Logged at", "Category", "Status", "Zone", "Latitude", "Longitude", "Location", "Description", "Responder type", "Responder name", "Vehicle reg", "Call sign", "Contact details", "Arrival time", "Outcome", "Reported by", "Detail fields"]];
    listIncidents().forEach(function (i) {
      rows.push([
        i.id, Demo.fmtDateTime(i.created_at), i.category, i.status, i.zone || "", i.gps_lat, i.gps_lng,
        i.location_address, i.description, i.responder_type, i.responder_name, i.vehicle_reg,
        i.call_sign, i.contact_details, i.arrival_time ? Demo.fmtDateTime(i.arrival_time) : "", i.outcome,
        userLabel(i.user_id), JSON.stringify(i.fields)
      ]);
    });
    return rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\r\n");
  }

  /* ---------------- boot, realtime, export ---------------- */
  var booted = false;
  function boot() {
    if (booted) return Promise.resolve();
    booted = true;
    var timeout = new Promise(function (res) { setTimeout(res, 12000); });
    var ready = loadProfile().then(function () { return loadAll(); }).then(function () {
      subscribeRealtime();
      sb.auth.onAuthStateChange(function (event) {
        if (event === "SIGNED_OUT") { logout(); }
      });
      notify();
    });
    return Promise.race([ready, timeout]);
  }

  function subscribeRealtime() {
    try {
      sb.channel("aman-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "notifications" }, function () { refreshSoon("notifications"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "patrol_slots" }, function () { refreshSoon("roster"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "slot_claims" }, function () { refreshSoon("roster"); })
        .on("postgres_changes", { event: "*", schema: "public", table: "messages" }, function () { refreshSoon("messages"); })
        .subscribe(function (status) {
          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            // realtime failed; fall back to periodic polling
            if (!subscribeRealtime._poll) {
              subscribeRealtime._poll = setInterval(function () {
                refreshSoon("notifications"); refreshSoon("roster");
              }, 30000);
            }
          }
        });
    } catch (e) { console.warn("realtime unavailable", e); }
  }

  window.AmanStore = {
    live: true,
    mode: "live",
    persistent: true,
    boot: boot,
    onChange: function (fn) { listeners.push(fn); },
    ZONES: Demo.ZONES,
    WINDOWS: Demo.WINDOWS,
    // auth
    sessionUser: sessionUser, login: login, logout: logout, register: register, ageFromDob: Demo.ageFromDob,
    // users
    users: listUsers, userById: userById, userLabel: userLabel, approveUser: approveUser, declineUser: declineUser,
    // slots & claims
    slots: listSlots, slotById: slotById, claimSlot: claimSlot, unclaim: unclaim, myClaims: myClaims,
    myClaimFor: myClaimFor, startShift: startShift, endShift: endShift, completedShifts: completedShifts,
    addSlot: addSlot, removeSlot: removeSlot, assignVolunteer: assignVolunteer, removeClaim: removeClaim,
    createSlot: createSlot, deleteOwnSlot: deleteOwnSlot, raiseSOS: raiseSOS,
    getSetting: getSetting, setSetting: setSetting,
    // incidents
    incidents: listIncidents, incidentById: incidentById, addIncident: addIncident, updateIncident: updateIncident,
    // pins
    pins: listPins, addPin: addPin, removePin: removePin,
    // notifications
    pushNotif: pushNotif, notificationsFor: notificationsFor, unreadCount: unreadCount, markAllRead: markAllRead,
    messages: listMessages, sendMessage: sendMessage, unreadChatCount: unreadChatCount, markChatSeen: markChatSeen,
    // misc
    zoneOfCoords: Demo.zoneOfCoords, incidentsCSV: incidentsCSV, resetDemo: function () {},
    // helpers
    fmtDate: Demo.fmtDate, fmtTime: Demo.fmtTime, fmtDateTime: Demo.fmtDateTime, timeAgo: Demo.timeAgo,
    slotStartISO: Demo.slotStartISO, todayISO: Demo.todayISO
  };
})();

</script>

  /* ---------- toast ---------- */
  function toast(msg, kind) {
    var root = $("#toast-root");
    var t = document.createElement("div");
    t.className = "toast " + (kind || "");
    t.textContent = msg;
    root.appendChild(t);
    setTimeout(function () { t.style.opacity = "0"; t.style.transition = "opacity .4s"; }, 3200);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3700);
  }

  /* ---------- modal ---------- */
  function modal(html, onMount) {
    closeModal();
    var root = $("#modal-root");
    root.innerHTML = '<div class="modal-overlay"><div class="modal">' + html + "</div></div>";
    var ov = root.firstChild;
    ov.addEventListener("click", function (e) { if (e.target === ov) closeModal(); });
    $all("[data-close]").forEach(function (b) { b.addEventListener("click", closeModal); });
    if (onMount) onMount(root);
  }
  function closeModal() { $("#modal-root").innerHTML = ""; }

  /* ---------- GPS ---------- */
  function captureGPS(cb) {
    if (!navigator.geolocation) return cb(null);
    navigator.geolocation.getCurrentPosition(
      function (p) { cb({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: Math.round(p.coords.accuracy), source: "device GPS" }); },
      function () { cb(null); },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
    );
  }
  function zoneCenter(zone) {
    var z = (window.AREA && window.AREA.zones) || {};
    var c = z[zone] || { lat: -26.1509, lng: 28.0043 };
    return { lat: c.lat, lng: c.lng, accuracy: null, source: "approximate zone centre (GPS unavailable)" };
  }

  function browserNotify(title, body) {

  }

  /* ---------- shell ---------- */
  function refreshBell() {
    var user = S().sessionUser();
    var badge = $("#bell-badge");
    if (!user) { badge.classList.add("hidden"); return; }
    var n = S().unreadCount(user);
    badge.textContent = n > 9 ? "9+" : n;
    badge.classList.toggle("hidden", n === 0);
    var list = S().notificationsFor(user);
    if (list.length && list[0].id !== lastNotifId) {
      if (lastNotifId) browserNotify(list[0].title, list[0].body);
      lastNotifId = list[0].id;
    }
    var chatNav = $("#nav-chat");
    if (chatNav) {
      var c = S().unreadChatCount ? S().unreadChatCount(user) : 0;
      chatNav.innerHTML = I("chat", 22) + "<span>Chat</span>" + (c > 0 ? '<span class="nav-badge">' + (c > 9 ? "9+" : c) + "</span>" : "");
    }
  }

  function submitRegister() {
    var d = {
      first_name: $("#r-first").value.trim(),
      surname: $("#r-surname").value.trim(),
      whatsapp: $("#r-whatsapp").value.trim(),
      email: $("#r-email").value.trim(),
      street: $("#r-street").value.trim(),
      suburb: $("#r-suburb").value,
      dob: $("#r-dob").value,
      emergency_contact_name: $("#r-ecname").value.trim(),
      emergency_contact_number: $("#r-ecnum").value.trim(),
      password: $("#r-pass").value
    };
    var errs = [];
    if (!d.first_name || !d.surname) errs.push("your name");
    if (!d.whatsapp || d.whatsapp.replace(/\D/g, "").length < 9) errs.push("a valid WhatsApp number");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) errs.push("a valid email");
    if (!d.street) errs.push("your street");
    if (!d.suburb) errs.push("your suburb");
    if (!d.dob) errs.push("your date of birth");
    else if (S().ageFromDob(d.dob) < 18) errs.push("— you must be over 18 to volunteer");
    if (!d.emergency_contact_name) errs.push("an emergency contact name");
    if (!d.emergency_contact_number) errs.push("an emergency contact number");
    if (d.password.length < 8) errs.push("a password of at least 8 characters");
    if (d.password !== $("#r-pass2").value) errs.push("— passwords don't match");
    if (!$("#r-18").checked || !$("#r-coc").checked) errs.push("— please confirm you are over 18 and agree to the Code of Conduct");
    if (errs.length) { toast("Please provide " + errs[0] + ".", "error"); return; }

    var rbtn = $("#r-submit");
    if (rbtn && S().live) { rbtn.disabled = true; rbtn.textContent = "Submitting application..."; }
    var res = S().register(d);
    if (res && typeof res.then === "function") {
      res.then(function (r) {
        if (!r.ok) {
          if (rbtn) { rbtn.disabled = false; rbtn.textContent = "Submit application"; }
          toast(r.error, "error");
          return;
        }
        location.hash = "#/pending";
        route();
      });
      return;
    }
    if (!res.ok) { toast(res.error, "error"); return; }
    S().login(d.email, d.password);
    location.hash = "#/pending";
    route();
  }

  function renderMyShiftCard(user) {
    var box = $("#my-shift-card");

      .sort(function (a, b) { return S().slotStartISO(a.slot) - S().slotStartISO(b.slot); })[0];
    var c = started || upcoming;
    if (!c || !c.slot) { box.innerHTML = ""; return; }
    var when = new Date(S().slotStartISO(c.slot));
    var mins = Math.round((when - Date.now()) / 60000);
    var eta = started ? "on shift now" :
      (mins <= 90 ? "starts in " + mins + " min" : "starts " + S().fmtDateTime(when.getTime()).replace(" · ", " at "));
    box.innerHTML =
      '<div class="card slot' + (c.slot.zone ? " " + (c.slot.zone.indexOf("A") !== -1 ? "zone-a" : "zone-b") : "") + '">' +
      '<div class="row spread"><div class="grow">' +
      '<span class="chip ' + (started ? "info" : "navy") + '">' + (started ? "Shift in progress" : "My next shift") + "</span>" +
      '<h3 style="margin:7px 0 2px">' + esc(c.slot.activity_window) + " · " + esc(c.slot.time_window) + "</h3>" +

      (started
        ? '<button class="btn btn-primary grow" data-end="' + c.slot_id + '">' + I("stop",15) + ' END SHIFT</button>'

  var rosterState = { month: null, selected: null };
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  var CAL_MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var CAL_DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  function renderRoster() {
    var user = S().sessionUser();
    setShell(true);
    setActiveNav("roster");
    screenEl.className = "screen";
    if (!rosterState.month) { rosterState.month = new Date(); rosterState.month.setDate(1); }
    if (!rosterState.selected) rosterState.selected = S().todayISO();

    var all = S().slots();
    var byDate = {};
    all.forEach(function (s) { (byDate[s.date] = byDate[s.date] || []).push(s); });
    var sel = rosterState.selected;
    var daySlots = (byDate[sel] || []).slice().sort(function (a, b) { return S().slotStartISO(a) - S().slotStartISO(b); });
    var today = S().todayISO();
    var myClaims = {};
    S().myClaims(user.id).forEach(function (c) { myClaims[c.slot_id] = c; });

    var y = rosterState.month.getFullYear(), m = rosterState.month.getMonth();
    var startDow = (new Date(y, m, 1).getDay() + 6) % 7; // Monday = 0
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var cells = "";
    var i, day, iso, ds;
    for (i = 0; i < startDow; i++) cells += '<span class="cal-cell off"></span>';
    for (day = 1; day <= daysInMonth; day++) {
      iso = y + "-" + pad2(m + 1) + "-" + pad2(day);
      ds = byDate[iso] || [];
      var need = ds.some(function (s) { return s.understaffed; });
      cells += '<button type="button" class="cal-cell' +
        (iso === today ? " today" : "") + (iso === sel ? " selected" : "") +
        '" data-day="' + iso + '" aria-label="' + iso + '">' + day +
        (ds.length ? '<span class="cal-dot' + (need ? " need" : "") + '"></span>' : "") +
        "</button>";
    }

    var dateLabel = S().fmtDate(sel);
    if (sel === today) dateLabel = "Today — " + dateLabel;
    var canCreate = sel >= today;

    screenEl.innerHTML =
      "<h1 class=\"page-title\">Patrol calendar</h1>" +
      '<p class="page-sub">Pick any date, choose your times, and a second volunteer joins you — patrols always run in pairs. START and END capture your GPS position and time for the shift log.</p>' +

      '<div class="card tight"><div class="cal-head">' +
      '<div class="cal-title">' + CAL_MONTHS[m] + " " + y + "</div>" +
      '<div class="row" style="gap:6px">' +
      '<button type="button" class="cal-nav" id="cal-prev" aria-label="Previous month">' + I("chev_l", 18) + "</button>" +
      '<button type="button" class="cal-nav" id="cal-next" aria-label="Next month">' + I("chev_r", 18) + "</button></div></div>" +
      '<div class="cal-grid">' + CAL_DOW.map(function (d) { return '<span class="cal-dow">' + d + "</span>"; }).join("") + cells + "</div></div>" +

      '<div class="row spread" style="margin:2px 0 10px">' +
      '<h3 style="font-size:0.95rem;margin:0">' + esc(dateLabel) + "</h3>" +
      (canCreate ? '<button type="button" class="btn btn-teal btn-sm" id="new-slot-btn">' + I("plus", 15) + " Create patrol</button>" : "") +
      "</div>" +

      (daySlots.map(function (s) { return slotCardHtml(s, user, myClaims[s.id], dateLabel); }).join("") ||
        '<div class="empty"><div class="big">' + I("calendar", 36) + "</div>No patrol on this date yet." + (canCreate ? " Be the first — create one." : "") + "</div>");

    $("#cal-prev").onclick = function () { rosterState.month = new Date(y, m - 1, 1); renderRoster(); };
    $("#cal-next").onclick = function () { rosterState.month = new Date(y, m + 1, 1); renderRoster(); };
    $all("[data-day]").forEach(function (b) {
      b.onclick = function () { rosterState.selected = b.getAttribute("data-day"); renderRoster(); };
    });
    var nsb = $("#new-slot-btn");
    if (nsb) nsb.onclick = function () { newSlotModal(user); };
    $all("[data-claim]").forEach(function (b) { b.onclick = function () { claimModal(S().slotById(b.getAttribute("data-claim")), user); }; });
    $all("[data-unclaim]").forEach(function (b) {
      b.onclick = function () {
        var res = S().unclaim(b.getAttribute("data-unclaim"), user.id);
        toast(res.ok ? "You've left that patrol." : res.error, res.ok ? "ok" : "error");
        renderRoster();
      };
    });
    $all("[data-del-slot]").forEach(function (b) {
      b.onclick = function () {
        var res = S().deleteOwnSlot(b.getAttribute("data-del-slot"), user.id);
        toast(res.ok ? "Slot deleted." : res.error, res.ok ? "ok" : "error");
        renderRoster();
      };
    });
    $all("[data-start]").forEach(function (b) { b.onclick = function () { startShiftFlow(b.getAttribute("data-start"), renderRoster); }; });
    $all("[data-end]").forEach(function (b) { b.onclick = function () { endShiftFlow(b.getAttribute("data-end"), renderRoster); }; });
  }

  function slotCardHtml(s, user, mine, dateLabel) {
    var names = s.claims.map(function (c) { return esc(c.user.first_name + " " + c.user.surname[0] + "."); }).join(", ") || "No volunteers yet";
    var creator = s.created_by ? S().userLabel(s.created_by) : "";
    var action = "";
    if (mine) {
      if (mine.status === "started")
        action = '<button class="btn btn-primary grow" data-end="' + s.id + '">' + I("stop", 15) + " END SHIFT</button>";
      else if (mine.status === "completed")
        action = '<span class="chip ok">' + I("check", 11) + " Completed " + esc(S().fmtTime(mine.end_shift_time)) + "</span>";
      else
        action = '<button class="btn btn-ok grow" data-start="' + s.id + '">' + I("play", 15) + ' START SHIFT</button><button class="btn btn-ghost danger btn-sm" data-unclaim="' + s.id + '">Leave</button>';
    } else if (!s.full) {
      action = '<button class="btn btn-teal grow" data-claim="' + s.id + '">Join this patrol</button>';
    } else {
      action = '<span class="chip grey">Fully staffed</span>';
    }

  /* ============================================================
     SOS — hold to send, alerts everyone on duty
     ============================================================ */
  var sosArming = null;
  function bindSOS() {
    var btn = $("#sos-btn");
    if (!btn) return;
    var bar = $("#sos-bar");
    function reset() { if (bar) bar.style.width = "0"; btn.classList.remove("arming"); }
    function cancel() { if (sosArming) { clearInterval(sosArming); sosArming = null; } reset(); }
    function arm(e) {
      if (sosArming) return;
      if (e.cancelable) e.preventDefault();
      var t0 = Date.now();
      btn.classList.add("arming");
      sosArming = setInterval(function () {
        var p = Math.min(1, (Date.now() - t0) / 3000);
        if (bar) bar.style.width = (p * 100) + "%";
        if (p >= 1) { cancel(); sendSOS(); }
      }, 50);
    }
    btn.addEventListener("touchstart", arm, { passive: false });
    btn.addEventListener("mousedown", arm);
    ["touchend", "touchcancel", "mouseup", "mouseleave"].forEach(function (ev) { btn.addEventListener(ev, cancel); });
    btn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }
  function sendSOS() {
    var user = S().sessionUser();
    if (!user) return;
    toast("Sending SOS with your position…");
    captureGPS(function (gps) {
      if (!gps) gps = { lat: window.AREA.center.lat, lng: window.AREA.center.lng, accuracy: null, source: "approximate area centre (GPS unavailable)" };
      var res = S().raiseSOS(user.id, gps);
      if (!res.ok) { toast(res.error, "error"); return; }
      browserNotify("SOS sent", "The coordinator and patrollers on duty have been alerted.");
      refreshBell();
      var maps = "https://www.google.com/maps/dir/?api=1&destination=" + gps.lat + "," + gps.lng;
      var wa = S().getSetting("whatsapp_group_url");
      modal(
        '<div class="dua-modal-title" style="color:var(--danger)">' + I("siren", 17) + " SOS sent — help is on the way</div>" +
        '<p class="m-sub">The coordinator and every patroller on duty have been alerted with your GPS position' + (res.on_duty ? " (" + res.on_duty + " on duty now)" : "") + ".</p>" +
        '<div class="card tight" style="background:var(--danger-soft);border:1px solid var(--danger-line)">' +
        '<div class="detail-list">' +
        '<div><span class="dl-k">Your position</span><span class="dl-v">' + gps.lat.toFixed(5) + ", " + gps.lng.toFixed(5) + "</span></div>" +
        '<div><span class="dl-k">Sent at</span><span class="dl-v">' + esc(S().fmtTime(Date.now())) + "</span></div>" +
        "</div></div>" +
        '<p class="m-sub" style="font-weight:700">Get to safety first. Never confront or chase anyone — armed response and SAPS do that.</p>' +
        '<div class="m-actions" style="flex-direction:column;gap:8px">' +
        '<a class="btn btn-danger block" href="tel:10111">' + I("megaphone", 16) + " Call SAPS 10111</a>" +
        (wa ? '<a class="btn btn-ok block" href="' + esc(wa) + '" target="_blank" rel="noopener">' + I("megaphone", 16) + " Message the WhatsApp group</a>" : "") +
        '<a class="btn btn-ghost block" href="' + maps + '" target="_blank" rel="noopener">' + I("pin", 16) + " Open my position on the map</a>" +
        '<button class="btn btn-ghost block" data-close>Close</button></div>'
      );
    });
  }
